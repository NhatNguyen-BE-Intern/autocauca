[package]
name = "nomstead-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
base64 = "0.22"
ctrlc = "3.4"
image = { version = "0.24.9", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.21"
ureq = { version = "2.9", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
