name: Build & Release AutoCauCa Portable (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Portable ZIP
        shell: pwsh
        run: ./build_portable.ps1

      - name: Upload Portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCauCa-Portable-Windows
          path: dist/AutoCauCa-Portable-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag "dist/AutoCauCa-Portable-Windows.zip" `
            --title "AutoCauCa Portable $tag (Windows x64)" `
            --notes "Ban Portable cho Windows x64. Giai nen file ZIP va bam dup AutoCauCa.bat de chay — khong can cai Python hay Git." `
            --clobber
